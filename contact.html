<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - UE DevOps à l'UPJV</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <main class="contact-container">
    <h2>Contactez-nous</h2>
    <p class="subtitle">Une question sur le cours DevOps ? Envoyez-nous un message !</p>

    <form action="#" method="POST" class="contact-form">
      <div class="form-group">
        <label for="name">Nom complet</label>
        <input type="text" id="name" name="name" placeholder="Votre nom" required>
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" placeholder="votre.email@exemple.fr" required>
      </div>

      <div class="form-group">
        <label for="subject">Sujet</label>
        <select id="subject" name="subject" required>
          <option value="" disabled selected>Choisissez un sujet</option>
          <option value="cours">Question sur les cours</option>
          <option value="projet">Projet DevOps</option>
          <option value="autre">Autre demande</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Votre message..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">Envoyer le message</button>
    </form>
  </main>
</body>
</html>
