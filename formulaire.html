<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Formulaire d'inscription</title>
  <style>
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group { margin-bottom: 1rem; }
    .status { font-size: 0.9rem; margin-top: 0.25rem; }
    .valide { color: green; }
    .invalide { color: red; }
  </style>
</head>
<body>

  <form id="monFormulaire">
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required>
      <div id="passwordFeedback" class="strength-indicator"></div>
    </div>

    <button type="submit" id="submitBtn" disabled>S'inscrire</button>
  </form>

  <script>
  function validerMotDePasse(motDePasse) {
    // au moins 8 caractères, au moins une lettre et au moins un chiffre
    const regex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[.#\-_*+=)({}!]).{8,}$/;
    return regex.test(motDePasse);
  }

  const inputPassword = document.getElementById('password');
  const submitBtn = document.getElementById('submitBtn');
  const passwordFeedback = document.getElementById('passwordFeedback');

    inputPassword.addEventListener('input', (e) => {
    const val = e.target.value;
    const estValide = validerMotDePasse(val);

    // Activation / désactivation du bouton de validation
    submitBtn.disabled = !estValide;

    // Affichage du statut de validité de base
    if (val.length === 0) {
      passwordFeedback.textContent = '';
    } else if (estValide) {
      passwordFeedback.textContent = 'Mot de passe valide';
    } else {
      passwordFeedback.textContent = '8 caractères min., avec 1 lettre et 1 chiffre requis';
    }
  });

    inputPassword.addEventListener('input', (e) => {
      const estValide = validerMotDePasse(e.target.value);
      // Active le bouton si le mot de passe respecte la regex, le d�sactive sinon
      submitBtn.disabled = !estValide;
    });
  </script>

</body>
</html>
