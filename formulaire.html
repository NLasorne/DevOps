<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Formulaire d'inscription</title>
  <style>
    .form-group {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <form id="monFormulaire">
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required>
    </div>

    <button type="submit" id="submitBtn" disabled>S'inscrire</button>
  </form>

  <script>
    function validerMotDePasse(motDePasse) {
      // au moins 8 caractères, une lettre, un chiffre et un caractère spécial (.#-_)
      const regex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[.#\-_]).{8,}$/;
      return regex.test(motDePasse);
    }

    const inputPassword = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');

    inputPassword.addEventListener('input', (e) => {
      const estValide = validerMotDePasse(e.target.value);
      // Active le bouton si le mot de passe respecte la regex, le désactive sinon
      submitBtn.disabled = !estValide;
    });
  </script>

</body>
</html>
