<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Formulaire d'inscription</title>
  <style>
    .form-group { margin-bottom: 1rem; }
    .status { font-size: 0.9rem; margin-top: 0.25rem; }
    .valide { color: green; }
    .invalide { color: red; }
  </style>
</head>
<body>

  <form id="monFormulaire">
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required>
      <!-- Ajout des classes status pour appliquer le style de base -->
      <div id="passwordFeedback" class="status"></div>
    </div>

    <button type="submit" id="submitBtn" disabled>S'inscrire</button>
  </form>

  <script>
  function validerMotDePasse(motDePasse) {
    // au moins 8 caractères, au moins une lettre, un chiffre et un caractère spécial
    const regex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[.#\-_*+=)({}!]).{8,}$/;
    return regex.test(motDePasse);
  }

  const inputPassword = document.getElementById('password');
  const submitBtn = document.getElementById('submitBtn');
  const passwordFeedback = document.getElementById('passwordFeedback');

  inputPassword.addEventListener('input', (e) => {
    const val = e.target.value;
    const estValide = validerMotDePasse(val);

    // Activation / désactivation du bouton
    submitBtn.disabled = !estValide;

    // Réinitialisation des classes
    passwordFeedback.classList.remove('valide', 'invalide');

    // Affichage du statut et gestion de la couleur
    if (val.length === 0) {
      passwordFeedback.textContent = '';
    } else if (estValide) {
      passwordFeedback.textContent = 'Mot de passe valide';
      passwordFeedback.classList.add('valide');
    } else {
      passwordFeedback.textContent = '8 caractères min., avec 1 lettre, 1 chiffre et 1 symbole (.#-_*+=)({}!)';
      passwordFeedback.classList.add('invalide');
    }
  });
  </script>

</body>
</html>
